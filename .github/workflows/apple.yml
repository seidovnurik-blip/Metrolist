name: Apple Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.apple
          METROLIST_APP_NAME: Metrolist Apple
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ""
          LASTFM_SECRET: ""

      - name: Sign APKs
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
          else
            keytool -genkeypair -keystore ks.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Metrolist Apple"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          for f in app/build/outputs/apk/foss/release/*.apk; do
            "$BT/apksigner" sign --ks ks.jks --ks-key-alias key --ks-pass pass:android --key-pass pass:android --out "out/$(basename "$f" .apk)-signed.apk" "$f"
          done
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: metrolist-apple
          path: out/*.apk
